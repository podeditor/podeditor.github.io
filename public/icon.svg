<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#202734" />
      <stop offset="100%" stop-color="#151b24" />
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#B7D894" />
      <stop offset="100%" stop-color="#E0F8C7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded App Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="510" height="510" x="1" y="1" rx="127" fill="none" stroke="#36415A" stroke-width="2" />

  <!-- Studio Sound Waves (Left) -->
  <g fill="url(#waveGrad)" opacity="0.65">
    <rect x="76" y="216" width="16" height="80" rx="8" />
    <rect x="108" y="176" width="16" height="160" rx="8" />
    <rect x="140" y="136" width="16" height="240" rx="8" />
    <rect x="172" y="196" width="16" height="120" rx="8" />
  </g>

  <!-- Studio Sound Waves (Right) -->
  <g fill="url(#waveGrad)" opacity="0.65">
    <rect x="324" y="196" width="16" height="120" rx="8" />
    <rect x="356" y="136" width="16" height="240" rx="8" />
    <rect x="388" y="176" width="16" height="160" rx="8" />
    <rect x="420" y="216" width="16" height="80" rx="8" />
  </g>

  <!-- Center Glowing Microphone Icon -->
  <g filter="url(#glow)">
    <!-- Mic Capsule -->
    <rect x="220" y="112" width="72" height="144" rx="36" fill="url(#waveGrad)" />

    <!-- Mic Stand Arc -->
    <path d="M192 216c0 35.3 28.7 64 64 64s64-28.7 64-64" fill="none" stroke="url(#waveGrad)" stroke-width="20" stroke-linecap="round" />

    <!-- Mic Stem & Base -->
    <line x1="256" y1="280" x2="256" y2="352" stroke="url(#waveGrad)" stroke-width="20" stroke-linecap="round" />
    <line x1="208" y1="352" x2="304" y2="352" stroke="url(#waveGrad)" stroke-width="20" stroke-linecap="round" />
  </g>
</svg>
